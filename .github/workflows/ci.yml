# officraft — the cloud check round, on every pull request and every push to main.
#
# WHY THIS EXISTS, AND WHAT IT DECIDES
# 🔴 THIS ROUND IS THE MERGE VERDICT (owner, 2026-08-11, card rc-c16ac4679fab).
# This file's header used to say the opposite — "bin/ci.sh remains the canonical,
# AUTHORITATIVE land gate ... this workflow does not certify a land" — and that
# is exactly backwards now. The reason the verdict lives here is that this round
# applies to EVERY pull request and anyone can read or re-run it, whereas a green
# on one developer's laptop is visible only to them and expires the moment the
# base moves.
#
# What bin/ci.sh is FOR, in the owner's own words, so nobody reads the above as
# "you never have to run anything locally":
#
#   「但是自己開發的時候，當然要自己先確認通過自己新增或是跟自己有關的
#     測試，沒問題才開PR上去跑，確認全部都通過」
#
# i.e. check your own area while developing, then open the PR and let this round
# rule on the whole thing. Both halves are real; only the verdict moved.
#
# ONE DEFINITION, AND THIS FILE IS NOT IT (T-4d88)
# Every check is a named target in the repo-root Makefile, and its implementation
# lives in exactly one recipe there. Each cell below calls the targets it owns —
# `bash bin/run-checks.sh <target> <target>` — and contains no test path, no npm
# script name, no module list and no gate logic of its own. A cell can choose
# WHICH checks it runs; it cannot restate HOW, so a cloud round and a local round
# cannot drift. If you are about to add a test invocation here: add a target to
# the Makefile.
#
# WHY THE WRAPPER AND NOT A BARE `make`: a zero exit says "nothing failed", not
# "something ran". A target whose recipe is emptied, commented out or cut short
# by an early exit succeeds instantly and in silence. Every check target ends by
# printing its own `[oc-check-done] <target>` line, and run-checks.sh requires
# the marker of every target IT WAS ASKED FOR — so each cell is held to its OWN
# checks, and no cell (and no list in this file) enumerates anybody else's.
# This protection is not new: the deleted macOS subset script was tee'd and
# grepped for its final marker for exactly this reason, and that home went with
# the script.
#
# The two subset scripts this file used to call (bin/ci-cloud.sh and
# bin/ci-macos-host.sh) are gone. They existed to be "the one definition of the
# subset", but each of them had to restate the checks, so the repo carried three
# copies of every rule and they had already drifted — the e2e isolation guard ran
# with its truncation protection locally and WITHOUT it in the cloud, on the round
# that guards everybody else's pull request.
#
# ONE CONCERN PER CELL, AND THEY RUN IN PARALLEL (owner ruling). The split is by
# what the checks ARE, not by how long they take: a red should be readable from
# the job name alone, and a failing step stops the steps after it, so folding two
# concerns into one cell hides the second one's verdict behind the first one's.
# Two cells exist because the owner named them specifically: the bin/ guard suites
# and the committed-binary integrity check are not part of the ordinary CI classes
# and get their own cell each.
#
# EVERYTHING RUNS ON macOS (owner ruling, T-4d88). The ubuntu cell is gone. It
# existed to catch macOS-only assumptions, which is a real thing to want and is
# no longer bought here — that is a KNOWN, ACCEPTED cost of this ruling, not an
# oversight, and it is written down so nobody "fixes" it by quietly adding a
# Linux cell whose font stack and mktemp semantics have never been measured.
#
# Triggers are pull_request AND push-to-main. Pushes to a WORKING branch are the
# local gate's job. main is different: without a post-merge round, a pair of
# individually-green PRs can combine into a red trunk and nobody finds out until
# the next author inherits it.
#
# ⚠️ TWO jobs at the bottom are main-only: notify-main-red (T-5d3b), which speaks
# only when a round failed, and auto-beta (T-9fe3), which publishes a prerelease
# when one is green. Neither CHECKS anything, which is the whole of what the
# "main runs no check a pull request does not" rule protects.
#
# THE GATE / NOT-A-GATE SPLIT IS DECLARED, NOT GUESSED
# Every job's body opens with a marker comment naming which it is, and
# bin/tests/auto-beta-guard.sh reads them. A job with no marker, with two, or with
# one it cannot read is a FAILURE that names the lines. A not-a-gate must pin
# itself to refs/heads/main and a gate must NOT, so a real gate cannot be excused
# from the set by relabelling it.
# ⚠️ AND THE NON-GATES ARE A CLOSED ROLL-CALL: exactly these two, no more. A THIRD
# job declaring itself not-a-gate reddens even when it is labelled honestly,
# because leaving auto-beta's required set is a decision with an owner ruling
# behind it. Adding one means editing the guard, which is the point.
#
# WHAT THE SPLIT BUYS: auto-beta's `needs` must equal the GATE set exactly, in
# both directions, so a gate added for pull requests cannot quietly become
# optional on main.
# ⚠️ auto-beta deliberately does NOT need notify-main-red: notify only runs when
# something already failed, so an edge to it would mean auto-beta never runs. The
# edge that DOES exist runs the other way. Wiring both would be a `needs` cycle,
# which GitHub rejects as a whole-file startup failure: zero jobs.
#
# NO GATE IN THIS WORKFLOW USES A SECRET, by design — so a fork PR runs the
# identical, complete check. Exactly one secret exists here and it is not a gate:
# notify-main-red reads a webhook URL, and it runs ONLY on push-to-main.
#
# The workflow is not permission-FREE, which is a different claim: the gate cells
# use no token at all, and auto-beta alone holds `permissions: contents: write`
# using the built-in GITHUB_TOKEN.
name: ci

# ⚠️ THIS BLOCK IS READ by bin/tests/auto-beta-guard.sh (W7), and it is the ONE
# place a filter can silence every gate at once without touching a job: a
# `paths-ignore` or a `branches` list under pull_request makes every gate skip on
# a pull request, and a skipped check looks exactly like a check that did not go
# red.
#
# What W7 pins, precisely:
#   • The VALUE of each trigger below is pinned verbatim. Adding or changing a
#     filter under `pull_request` or `push` reddens W7.
#   • A trigger KEY on W7's allowlist may be ADDED here without touching the
#     guard. `workflow_dispatch` is on that list today.
#   • Any other trigger (`schedule`, `pull_request_target`, …) is refused until it
#     is added to the allowlist in that guard, in the SAME commit — and that edit
#     is the review. `pull_request_target` is the one this matters most for: it
#     runs with a write token against fork code.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete — cancel it rather
# than pay for (and wait on) a result nobody will read.
#
# main is exempt, and that asymmetry is the point: a cancelled run reports
# conclusion=cancelled, which is NOT a red. Two merges landing close together
# would cancel the first one's round, and the trunk commit that actually broke
# main would end up carrying no verdict at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # go — the whole Go story for every module under cli/ and server/. Staging the
  # embed assets first is not this cell's choice: the Makefile declares it as a
  # prerequisite of test-go, because server/ocserverd's tests read the STAGED
  # embed and a clean checkout carries .gitkeep-only staging dirs. A runner is by
  # definition always a clean checkout.
  go-checks:
    # oc-job-role: gate
    # Pinned, not macos-latest: `latest` moves between OS majors on GitHub's
    # schedule and these checks assert host-shaped behaviour. A version bump
    # should be a commit somebody chose, not a Tuesday.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # T-64 PROBE: does this make origin/main resolvable in this job?
          fetch-depth: 0
      # Pinned to what the repo develops against (go.mod says 1.26.4).
      # check-latest:false + an exact version keeps the runner from silently
      # drifting ahead of the developer.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          # Only server/ocserverd has third-party deps (hence a go.sum); the
          # cli/ modules are stdlib-only. setup-go errors on an unresolved path.
          cache-dependency-path: server/ocserverd/go.sum
      - run: bash bin/run-checks.sh lint-go-naming lint-go-fmt lint-go-vet build-go test-go test-system-interaction-examples

  # ---------------------------------------------------------------------------
  # frontend — typecheck, the static CSS/token lints, and the jsdom unit suite.
  # The real-browser half is a separate cell on purpose (see frontend-ct).
  #
  # ⚠️ THIS CELL NEEDS GO, and that is not an accident of packaging.
  # The unit suite contains a cross-language parity test
  # (frontend/src/lib/themeName.parity.test.ts) whose whole reason to exist is
  # that TS and Go must reach the SAME verdict on the same cases — so it shells
  # out to `go test` and compares. A parity test belongs to NEITHER side; it
  # needs both toolchains wherever it runs. It lives in the vitest suite because
  # that is the harness that can call both, so this is the cell that carries Go.
  #
  # This dependency was invisible until T-4d88 split the cells: the old cloud
  # layout ran Go and the frontend in one cell, so `go` was on PATH by luck. The
  # split did not create the coupling, it exposed it (spawnSync go ENOENT).
  # The sibling case does NOT need this: paintArtifact.test.ts shells out too,
  # but only to `vite build`, which this cell's own toolchain already provides.
  frontend-checks:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same pins as go-checks, for the same reason: the parity test asserts
      # agreement with the Go implementation, so a runner that floats ahead of
      # what the repo develops against would redden on toolchain drift.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum
      - run: bash bin/run-checks.sh lint-ts lint-css-tokens lint-css-token-roles test-frontend-unit

  # ---------------------------------------------------------------------------
  # frontend-ct — real-browser layout + paint guards. Separate from
  # frontend-checks because vitest runs in jsdom, which applies no layout engine:
  # a pure-CSS regression ships GREEN through the unit suite, so these two cells
  # answer different questions and a red should say which one broke.
  #
  # ⚠️ Font environment: the CT harness page loads no webfonts and falls through
  # to system-ui, so these guards measure the RUNNER's system font, never the font
  # a user sees. That is a pre-existing gap. If a guard reddens here and is green
  # on a dev Mac, the answer is the font environment — NEVER a looser threshold.
  frontend-ct:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash bin/run-checks.sh test-frontend-ct

  # ---------------------------------------------------------------------------
  # drift — the regenerate-and-byte-compare class, together because they share
  # one failure mode and one remedy.
  #
  # ⚠️ THE TOOLCHAIN PINS BELOW ARE LOAD-BEARING FOR THIS CELL, not hygiene.
  # Every gate here asserts that a generator reproduces a committed artifact
  # EXACTLY. Let the runner float ahead of the dev machine's Go/Node and these
  # start reddening on generator output changes while the code is perfectly fine
  # — the precise false-red this whole round exists to avoid.
  drift-checks:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash bin/run-checks.sh drift-ocapi drift-schema-ts drift-theme-tokens drift-message-keys drift-fonts drift-mcp-catalog

  # ---------------------------------------------------------------------------
  # contract-guards — the stdlib-python3 scanners over tracked files, each shipped
  # WITH its own positive control (the Makefile target runs both halves; a scanner
  # nobody verified still prints all green).
  contract-guards:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The user-operation guard compares every changed contract block with
          # the PR base; a shallow checkout would turn that provenance check into
          # an unverified guess.
          fetch-depth: 0
      - run: bash bin/run-checks.sh lint-uplink-contract lint-effort-vocab lint-shadow-claim lint-user-operation-contract

  # ---------------------------------------------------------------------------
  # conformance — the black-box import lint (fast, static) and then the full
  # HTTP-only behaviour suite against a throwaway ocserverd and SQLite. The lint
  # runs first inside the same cell so an import violation reddens without paying
  # for the server boot.
  conformance:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum
      - run: bash bin/run-checks.sh lint-conformance-blackbox test-conformance

  # ---------------------------------------------------------------------------
  # hygiene — what is TRACKED (path denylist) and what is IN the files (gitleaks).
  hygiene:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # gitleaks is a HARD dependency, not an optional extra: an unrun secret
      # scanner and a clean scan are indistinguishable. Installing it here is why
      # the target can afford to treat "not found" as a failure.
      - name: install gitleaks
        run: brew install gitleaks
      - run: bash bin/run-checks.sh scan-tracked-paths scan-secrets

  # ---------------------------------------------------------------------------
  # bin-guards — its own cell by owner ruling: the bin/ guard suites are the
  # tests OF the tooling (the release publish path, the CI marker guard, the lock
  # guard), not one of the ordinary CI classes, and their reds should be readable
  # as themselves rather than as "something in some cell broke".
  bin-guards:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash bin/run-checks.sh test-bin-guards

  # ---------------------------------------------------------------------------
  # tcc-anchor — its own cell by owner ruling. The one owner-approved committed
  # binary: its manifest binds a reviewable source snapshot to the checked-in
  # executable, so this fails closed whenever the source moves without an explicit
  # binary refresh.
  tcc-anchor:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash bin/run-checks.sh scan-tcc-anchor

  # ---------------------------------------------------------------------------
  # e2e-isolation-guard — the hermetic safety layer that keeps the DESTRUCTIVE
  # e2e suites from wiping a live agent-fleet host. Toolchain-free and fast, and
  # deliberately not folded into macos-e2e: it is the thing that has to be true
  # BEFORE that suite is safe to run anywhere.
  e2e-isolation-guard:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash bin/run-checks.sh test-e2e-isolation-guard

  # ---------------------------------------------------------------------------
  # macos-e2e — the real-browser end-to-end suite against an isolated station.
  # This one is NOT a Makefile target: it is not a check over the tree, it stands
  # a whole station up and drives it, and run_all.sh owns that lifecycle
  # (setup -> playwright -> teardown) including its own prerequisite refusals.
  macos-e2e:
    # oc-job-role: gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # e2e_test/setup.sh deliberately uses tmux as the cross-exec lifecycle
      # carrier. GitHub's macOS image does not provide it by default; install
      # the same prerequisite explicitly so CI exercises the shipped path.
      - name: install tmux for isolated e2e
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          tmux -V

      # setup.sh refuses to run without an oc.toml that binds the non-prod port
      # and names a repo-local DSN — those refusals ARE the prod guards, so a
      # runner has to satisfy them rather than skip them.
      - name: generate the isolated station's oc.toml
        run: bash e2e_test/gen-oc-toml.sh

      # Deliberately sets NOTHING (T-c329): the specs that need a live agent and
      # burn API quota are default-off and declare themselves by filename, so a
      # runner opts OUT of nothing — it simply never asks to spend.
      - name: real-browser e2e (isolated station on :8791)
        run: |
          set -o pipefail
          bash e2e_test/run_all.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # A zero exit says "nothing failed", not "something ran". This asserts the
      # suite actually reported, above a floor. Deliberately NOT `if: always()` —
      # it exists to catch a GREEN run that guarded nothing.
      - name: guard — the suite must have actually executed specs
        run: bash e2e_test/assert-specs-ran.sh "$RUNNER_TEMP/e2e.log"

      - name: upload e2e log and playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-report
          path: |
            ${{ runner.temp }}/e2e.log
            e2e_test/playwright-report
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # WHO FINDS OUT THAT main WENT RED (T-5d3b). The cells above hang a verdict on
  # the commit that caused it — that half is a mechanism. The other half,
  # "somebody learns about it", had none: GitHub's default failure routing is a
  # per-account notification setting that cannot be read from here, so a red trunk
  # was found only by whoever happened to look, and the next author inherited it
  # believing the red was theirs. owner ruling (rc-c2edbfdc36a1): post a webhook
  # at the maintainer, and deliberately NOT open an issue.
  #
  # WHY ONE AGGREGATING JOB AND NOT A STEP INSIDE EACH JOB
  # A step per job is the same curl copied N times (it will drift), and a round
  # that reddens two jobs then sends two messages for one event. The price of
  # `needs:` is that it re-enumerates the job names, so ANOTHER job added without
  # touching this line would silently stop being covered. That enumeration is
  # therefore not left to discipline: bin/tests/main-red-notify-guard.sh asserts
  # that every other job in this file appears in the `needs:` below.
  #
  # EVERY other job, auto-beta included (T-9fe3): the thing it does is publish the
  # release the station actually runs, and a publish that fails on main IS
  # "merged" and "reachable" drifting apart. (The edge only goes this way —
  # auto-beta must NOT need this job. Both directions would be a `needs` cycle
  # and GitHub would schedule zero jobs.)
  #
  # SCOPE: push-to-main only. A pull request is somebody's own branch and its red
  # is already in front of them. A CANCELLED round does not notify either, because
  # failure() is false for cancelled.
  notify-main-red:
    # oc-job-role: not-a-gate
    needs:
      - go-checks
      - frontend-checks
      - frontend-ct
      - drift-checks
      - contract-guards
      - conformance
      - hygiene
      - bin-guards
      - tcc-anchor
      - e2e-isolation-guard
      - macos-e2e
      - auto-beta
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # THE URL IS THE CREDENTIAL. The receiving inlet authenticates on a token
      # carried in the URL itself and answers an identical silent 200 to
      # everything (unknown token included), so (a) a leaked URL lets anyone forge
      # "main is red" at the maintainer, and (b) a 200 here does not prove the
      # TOKEN was good. What this side CAN see is the HTTP status, and
      # --fail-with-body below is what turns a moved/down/mistyped inlet into a
      # red instead of a silent exit 0.
      # Hence: secret only, never a literal in this file, never echoed.
      - name: tell the maintainer that main is red
        env:
          MAIN_RED_WEBHOOK_URL: ${{ secrets.OC_MAIN_RED_WEBHOOK_URL }}
          # Everything below is passed through the environment rather than
          # interpolated into the script body — a ${{ }} expansion inside `run:`
          # is a shell-injection seam, and none of these values is worth one.
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$MAIN_RED_WEBHOOK_URL" ]]; then
            echo "::error::main is red and nobody was told: repository secret OC_MAIN_RED_WEBHOOK_URL is not set." >&2
            exit 1
          fi
          # Which jobs are red is DERIVED from `needs`, so this step carries no
          # second list of job names to keep in step with the one above.
          red="$(jq -r 'to_entries
                        | map(select(.value.result != "success"))
                        | map("\(.key)=\(.value.result)")
                        | join(" ")' <<<"$NEEDS_JSON")"
          # The body is delivered VERBATIM as a chat message into a human-facing
          # inbox, so it stays three short lines plus a link.
          #
          # Built with printf, NOT a multi-line shell string. A continuation line
          # of such a string starts at column 1, which is less indented than this
          # block scalar — YAML ends the scalar there and the whole workflow file
          # stops parsing. That is not hypothetical: it shipped that way once and
          # GitHub answered with a startup failure in which ZERO jobs ran.
          #
          # "非 success" and not "紅", because a skipped job also lands in `red`.
          # "項目" and not "檢查": `needs` includes `auto-beta`, which is NOT a
          # gate — calling it a failed CHECK sends the reader hunting for a broken
          # test that does not exist.
          body="$(printf '主幹紅了：%s@%s\n非 success 的項目：%s\n執行紀錄：%s' "$REPO" "${COMMIT_SHA:0:12}" "${red:-unknown}" "$RUN_URL")"
          # --fail-with-body: without it curl exits 0 on 404/502/400 and this step
          # stays green while nobody was told.
          #
          # --retry 2 ALREADY covers the errors worth retrying: 429, 5xx, and
          # (with --retry-connrefused) a refused connection. There is deliberately
          # NO --retry-all-errors: its only added effect is retrying PERMANENT
          # 4xx, where a second attempt cannot succeed, and its cost is turning
          # one "main is red" into THREE in the maintainer's inbox when the inlet
          # accepts the message and then answers non-2xx.
          #
          # The response body is discarded rather than logged: an error page from
          # the wrong host can quote the request URL back, and that URL is the
          # credential. The exit code is the signal.
          printf '%s' "$body" | curl -sS --fail-with-body --max-time 20 \
            --retry 2 --retry-connrefused \
            -X POST -H 'Content-Type: text/plain; charset=utf-8' \
            --data-binary @- "$MAIN_RED_WEBHOOK_URL" >/dev/null

  # ---------------------------------------------------------------------------
  # AUTOMATIC BETA ON A GREEN TRUNK (T-9fe3). Landing on main did not put anything
  # anywhere: the station runs a GitHub RELEASE and autodeploy follows the newest
  # one, never main. So every merged change waited for a human to remember to cut
  # a beta, and "merged" and "reachable" drifted apart silently.
  #
  # WHAT IT DELIBERATELY DOES NOT DO
  # It publishes a PRERELEASE and nothing else. Turning a beta into the final
  # release — the flip that moves the Latest pointer — stays a human command run
  # by hand: bin/release's other subcommand, deliberately never named in any
  # workflow file. bin/tests/auto-beta-guard.sh reddens on that subcommand's name
  # and on the `gh release edit` flags that move the Latest pointer. Those flags
  # are NOT spelled out here on purpose: that guard scans this file as text,
  # comments included.
  # ⚠️ That is TWO SPECIFIC SHAPES, not a proof that GA cannot be automated. A
  # workflow could still reach GA via a script it calls, `gh api`, or a curl to
  # the REST API. What the guard buys is that the two routes anyone would actually
  # reach for both fail loudly.
  #
  # ONE UNSTATED DEPENDENCY, named here so nobody removes it by accident: the
  # version rule ("greatest existing + patch") is only collision-free because main
  # is EXEMPT from cancel-in-progress in the concurrency block above. That
  # exemption serialises main's rounds, so a second merge's checkout already sees
  # the tag the first one created.
  # ⚠️ And the honest cost of that serialisation: GitHub keeps only ONE pending
  # run per concurrency group, so with three merges in quick succession the middle
  # one's run is cancelled — no verdict AND no beta.
  #
  # WHO ACTUALLY MOVES WHEN THIS FIRES — do not read it wider than this. What is
  # published is a PRERELEASE, and a station only picks one up when BOTH
  # updater.receive_beta and updater.auto_update are on, and both default to off.
  # The owner's own machine has both on and accepted that consequence explicitly
  # (ruling 2, 2026-08-05), which is why there is deliberately NO throttle, no
  # approval environment and no confirmation gate here.
  #
  # WHY macos-15: bin/release publish refuses to run anywhere but darwin/arm64
  # (the asset IS darwin-arm64), it runs the FULL bin/ci.sh inside a staging
  # worktree at the target commit before it builds, and then it builds the real
  # product.
  #
  # WHY needs LISTS EVERY GATE JOB: "the trunk is green" has to mean all of the
  # checks, not the cheap ones. A `needs` that falls behind a newly-added gate
  # would publish on a partially-checked commit, so the guard computes the set
  # difference both ways rather than comparing against a hardcoded list.
  # ⚠️ EVERY GATE, and deliberately NOTHING ELSE — notify runs only on failure, so
  # needing it would mean this job never runs, and needing each other would be a
  # `needs` cycle GitHub answers with zero scheduled jobs.
  auto-beta:
    # oc-job-role: not-a-gate
    needs:
      - go-checks
      - frontend-checks
      - frontend-ct
      - drift-checks
      - contract-guards
      - conformance
      - hygiene
      - bin-guards
      - tcc-anchor
      - e2e-isolation-guard
      - macos-e2e
    # Both halves are required, and they exclude different things. The ref test is
    # what holds the line TODAY: without it every push to a working branch would
    # try to publish. The event test excludes any OTHER trigger that also reports
    # refs/heads/main — it is there for the edit that adds a workflow_dispatch or
    # a schedule, which would otherwise become a publish-on-demand button nobody
    # reviewed as one. bin/tests/auto-beta-guard.sh requires both.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    # A budget, not a measurement: full bin/ci.sh on a hosted macOS runner plus a
    # real product build plus the upload.
    timeout-minutes: 90
    # The ONLY elevated permission in this workflow, and it lives on this job
    # alone — the workflow default stays read-only, so the gate cells cannot write
    # anything even by mistake. Built-in GITHUB_TOKEN only: no PAT, no secret.
    #
    # ⚠️ A JOB-LEVEL `permissions:` BLOCK REPLACES THE SET WHOLESALE — every key
    # not listed here is `none` for this job, whatever the workflow default says.
    # So both keys are load-bearing and neither may be dropped while "the other
    # one is the important one":
    #   • contents: write — creating the release.
    #   • actions:  read  — bin/release's CI gate reads THIS run's own verdict
    #     from /actions/runs/<id> and .../jobs. Without this key the token is
    #     rejected, the gate fails closed, and NO beta can be published at all.
    #     (It is read-only, and it is scoped to this job like the write is.)
    permissions:
      contents: write
      actions: read
    steps:
      # BOTH inputs are load-bearing. fetch-depth: 0 is needed twice over —
      # bin/release cuts a staging worktree with `git worktree add --detach <sha>`,
      # which needs the commit's real history; and bin/next-beta-tag compares
      # against every existing git tag. fetch-tags is spelled out rather than
      # inferred from fetch-depth, because a tagless checkout leaves
      # `git tag --list` at rc=0 with zero output.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache-dependency-path: server/ocserverd/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '22.10.0'
          check-latest: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # bin/release runs the full bin/ci.sh, whose secret scan treats a missing
      # gitleaks as a FAILURE rather than a skip. Same reason hygiene installs it.
      - name: install gitleaks
        run: brew install gitleaks

      # ── IS THIS COMMIT STILL main's HEAD? ─────────────────────────────────
      # Nothing stops anyone re-running an OLD main run, and the version rule is
      # "greatest existing + patch", so an older tree would be handed a HIGHER tag
      # than the current one. The station's update check admits by SEMVER ORDER,
      # not by publication date, so that older tree would WIN: behaviour rolls
      # backwards while the version number moves forwards.
      #
      # A stale run SKIPS, loudly, and does not fail: the run is not broken and
      # its gate jobs are still a real verdict on that commit.
      - name: is this commit still main's head (a re-run of an old run must not publish)
        id: freshness
        env:
          OC_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          git fetch --quiet origin main
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$HEAD_SHA" == "$OC_TRIGGER_SHA" ]]; then
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
            echo "this run's commit IS main's head ($HEAD_SHA) — proceeding"
          else
            echo "fresh=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=auto-beta skipped::this run's commit ($OC_TRIGGER_SHA) is no longer main's head ($HEAD_SHA), so publishing it would give OLDER code a HIGHER version than what is already out. Nothing was published."
            echo "SKIPPING the beta: triggering commit $OC_TRIGGER_SHA is not main's head $HEAD_SHA."
          fi

      # The version number is computed by a script in the repo, not by inline
      # shell here. It is read-only and creates nothing.
      - name: compute the next beta tag
        id: tag
        if: steps.freshness.outputs.fresh == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="$(bash bin/next-beta-tag)"
          [[ -n "$TAG" ]] || { echo "bin/next-beta-tag printed nothing" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "next beta tag: $TAG"

      # --target is the commit this run was triggered by, NOT whatever main points
      # at when the job finally starts. --no-settle is the owner's ruling 1. This
      # command still applies the full CI gate and still reads back what GitHub
      # stored; neither is skippable. The gate reads THIS run's own job
      # conclusions from the Actions API, which is why `GH_TOKEN` below is
      # load-bearing for more than `gh`: bin/release authenticates that read with
      # it (and the job's `actions: read` is what makes the token acceptable).
      # Anonymous still works for a hand-run publish, but a hosted runner shares
      # its egress IP and the anonymous quota is 60/hour per IP.
      #
      # ⚠️ THE RELEASE IS CREATED BEFORE IT IS VERIFIED, AND NOTHING ROLLS IT BACK.
      # bin/release uploads and only then reads back what GitHub stored; there is
      # no `gh release delete` anywhere in it. So a RED job does not imply "no beta
      # exists". Cleaning that up is a human action; see docs/dev/README.md.
      #
      # Values reach the shell through `env:`, never interpolated into the script
      # body — closing the seam rather than fixing a live hole, but "the values
      # happen to be safe today" is not a property anything enforces.
      - name: publish the beta (prerelease) for this commit
        if: steps.freshness.outputs.fresh == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          OC_TAG: ${{ steps.tag.outputs.tag }}
          OC_TARGET_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          bash bin/release publish \
            --beta "$OC_TAG" \
            --target "$OC_TARGET_SHA" \
            --no-settle 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: upload the publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-beta-publish-log
          path: ${{ runner.temp }}/publish.log
          if-no-files-found: warn
