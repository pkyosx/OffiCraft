# .github/workflows/ga-promote.yml — the GA button (T-39a5).
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS IS, AND THE RULING THAT ALLOWS IT TO EXIST
# ─────────────────────────────────────────────────────────────────────────────
# Flipping a verified prerelease to the final release ("GA") used to be forbidden
# to automate at all: bin/tests/auto-beta-guard.sh refused, under W4/W4b, any file
# under .github/ that so much as NAMED the subcommand, on the ruling that the
# beta->final flip is a human decision.
#
# 🔴 THAT RULING WAS OVERTURNED BY THE OWNER ON 2026-08-28, in rc-f9d284c0aef7,
# with one condition attached. His words:
#
#     "決定是我下的 然後我會讓你幫我執行 UI 上可以有這個 action
#      但是只有 seth / eva 可以跑這個"
#
# Three things follow from that sentence, and all three are mechanised — here and
# in bin/tests/auto-beta-guard.sh (W4e/W4f), which now pins THIS FILE's shape
# instead of pinning its non-existence:
#
#   1. The action may exist and may be triggered from the GitHub UI.
#   2. Only people the owner has given write access to this repo may run it. See
#      WHO CAN PRESS THIS below — the UI alone does NOT enforce that, so this
#      workflow enforces it itself.
#   3. "決定是我下的" — WHICH tag ships is still a human decision, so the tag
#      arrives as an INPUT. This workflow never selects one. There is deliberately
#      no "newest beta" lookup here: that would hand the decision to the machine,
#      which is the half of the old ruling that was NOT overturned.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 WHO CAN PRESS THIS
# ─────────────────────────────────────────────────────────────────────────────
# Collaborators of this repo with write or admin access — nobody else. That is
# asked of GitHub at run time, not spelled out here: the gate reads
# `GET /repos/{owner}/{repo}/collaborators/{actor}/permission` and proceeds only
# on `admin` or `write`. The owner's ruling was "only seth / eva"; as of
# 2026-08-28 the repo's collaborators ARE exactly pkyosx (admin) and 8thEdition
# (push), so this is that ruling — expressed as the permission it actually rests
# on rather than as two strings that go stale the moment the list changes.
#
# ⚠️ GITHUB ONLY KEEPS OUT ACCOUNTS WITHOUT WRITE ACCESS — THAT IS THE WHOLE OF
# WHAT IT ENFORCES FOR US, AND THAT IS WHY THE FIRST STEP EXISTS.
# There is no per-workflow "who may dispatch" setting. `workflow_dispatch` is open
# to every account with write access, and a repo can grow read/triage
# collaborators, org members and outside contributors who must not ship a GA. So
# the check lives in the job's FIRST STEP, before anything touches a release, and
# a refusal is a red run that names the actor and the permission GitHub reported.
# Restricting the UI is not a substitute for it and must not be treated as one.
#
# ⚠️ FAIL-CLOSED, INCLUDING WHEN THE ANSWER NEVER ARRIVES. An API error, a missing
# gh, an unparseable body, an absent field — all refuse. There is no "could not
# check, carry on" path, and bin/tests/auto-beta-guard.sh (W4eD) proves that by
# executing this step's own run: body against a stubbed gh.
#
# To change who may press: change who has write access to the repo. There is no
# list in this file to edit, and adding one would be a step backwards.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 PRESSED IT BY MISTAKE? HOW TO ROLL BACK
# ─────────────────────────────────────────────────────────────────────────────
# A wrong promote does TWO separable things, and they need two different undos.
# Do them in this order.
#
# (1) STOP STABLE STATIONS FROM TAKING IT. This is the urgent half.
#     server/ocserverd/update_check.go reads GitHub's public release pages: a
#     station on the stable channel takes whatever release GitHub marks Latest
#     (github.com/<repo>/releases/latest). The Latest POINTER is what feeds
#     stable stations, so move it back:
#
#         gh release edit <previous-good-GA-tag> --repo pkyosx/OffiCraft --latest=true
#
#     Stable-channel stations stop being offered it on their next check. Anyone who
#     already upgraded in the window stays upgraded — this stops the bleeding, it
#     does not un-ship the bytes. There is no downgrade path in the updater.
#
# (2) FLIP THE WRONG TAG BACK TO A PRERELEASE, so the release list says what it is:
#
#         gh release edit <wrongly-promoted-tag> --repo pkyosx/OffiCraft --prerelease=true
#
#     ⚠️ This does NOT hide it from beta-channel stations. They take the
#     semver-greatest entry of github.com/<repo>/releases.atom, which carries no
#     prerelease flag, so the tag stays on offer to them either way — until a
#     greater tag is published.
#
# (3) VERIFY BOTH, because issuing a command is not the same as it landing — the
#     whole reason bin/release reads back rather than trusting `gh`:
#
#         gh api repos/pkyosx/OffiCraft/releases/latest --jq .tag_name
#         gh release view <wrongly-promoted-tag> --repo pkyosx/OffiCraft --json isPrerelease
#
# NOTHING IS DELETED in any of this. Do NOT `gh release delete` the bad tag: the
# assets are what someone may already be running, and bin/release's promote path
# fingerprints the asset set precisely so the shipped bytes stay the tested bytes.
#
# ⚠️ IF THE RUN FAILED PART-WAY, read its log before undoing anything. promote is
# verify -> flip -> read-back: a VERIFY-FAILED [release-latest] means the flip was
# issued and the read-back could not confirm it, so check (3) FIRST — the release
# may be fully promoted, not promoted at all, or promoted with the pointer unset.
name: GA promote

# Manual only. No push, no pull_request, no schedule — this workflow must never
# fire on its own, and bin/tests/auto-beta-guard.sh (W4f) pins that: a second
# workflow file is allowed to exist ONLY while workflow_dispatch is its one
# trigger, because that is what keeps it out of every push/PR run and therefore
# out of the job universe auto-beta's `needs` reasons about.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing verified prerelease tag to flip to GA, e.g. v0.5.256'
        required: true
        type: string

# Read-only by default; the job below asks for the one write it needs.
permissions: {}

# One at a time, and never cancel one in flight: the flip is a sequence of
# GitHub mutations followed by a read-back, and a cancelled run can leave the
# release flipped with nothing having confirmed it.
concurrency:
  group: ga-promote
  cancel-in-progress: false

jobs:
  ga-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 🔴 THE AUTHORIZATION GATE. First step, before any checkout, so a refused
      # actor never reaches a single line of this repo's code. It does NOT carry a
      # list of names: it ASKS GitHub what this actor's permission on this repo is,
      # so "who may press" tracks the repo's collaborator list instead of drifting
      # from it. Fail-closed by shape: the ONLY path that reaches `exit 0` is a
      # successful read that came back admin or write; every other outcome — the
      # API erroring, gh missing, the body unparseable, the field absent, a read /
      # none / triage answer — falls through to the refusal.
      - name: authorize actor
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          # The job's own contents:write token. This endpoint needs push-level
          # access to the repo and GitHub publishes no narrower `permissions:` key
          # for collaborator reads (there is no `collaborators:`/`metadata:` key to
          # ask for), so the grant the job already needs to promote is also the one
          # that authorizes this read — nothing extra is opened for the gate.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `|| true` so a non-zero gh (403, 404, network, not installed) leaves
          # PERM empty and lands in the refusal, rather than aborting under `set -e`
          # with an exit status a future `continue-on-error` could mistake for noise.
          PERM="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || true)"
          case "${PERM:-}" in
            admin|write)
              echo "[ga-promote] actor '$ACTOR' has '$PERM' access to $REPO — proceeding"
              exit 0
              ;;
          esac
          echo "[ga-promote] REFUSED: actor '$ACTOR' may not promote a release to GA." >&2
          echo "[ga-promote] GitHub reports this account's permission on $REPO as" >&2
          echo "[ga-promote] '${PERM:-<unreadable>}'. Only collaborators with write or admin" >&2
          echo "[ga-promote] access may run this workflow; an unreadable answer is refused" >&2
          echo "[ga-promote] too, because a GA flip is not something to guess at." >&2
          echo "[ga-promote] This is an owner ruling (2026-08-28, rc-f9d284c0aef7), not a" >&2
          echo "[ga-promote] permissions accident. If you need to ship, ask a repo admin." >&2
          exit 1

      - uses: actions/checkout@v5

      # No rebuild, by design: promote flips an EXISTING, already-verified
      # prerelease, so the bytes that ship are the bytes that were tested. It needs
      # gh and nothing else — no go, no node, no full history.
      - name: promote the tag to GA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OC_TAG: ${{ inputs.tag }}
        run: bin/release promote "$OC_TAG"
